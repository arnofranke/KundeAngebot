<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KundenAngebot">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>KundenAngebot</title>
<style>
:root{--green:#123b2a;--green2:#1d5b40;--bg:#f3f5f4;--card:#fff;--text:#17211d;--muted:#68736e;--line:#dfe5e2;--danger:#a33b32;--shadow:0 8px 24px rgba(18,59,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(243,245,244,.94);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 3px}.sub{color:var(--muted);font-size:13px}main{max-width:720px;margin:auto;padding:14px 14px 92px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px;border-radius:14px;background:#eef3f0}.stat b{display:block;font-size:28px;margin-top:3px}.stat span{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin:11px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #cfd8d3;border-radius:11px;padding:11px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:11px;font-weight:500;background:#fafcfb}.check input{width:19px;height:19px}.type-grid{display:flex;flex-direction:column;gap:10px}.type-card{border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;background:#fff;transition:.15s}.type-card.offer{padding:24px 18px;border-color:var(--green);background:#eef3f0}.type-card.term{padding:11px 14px;text-align:center}.type-card.selected{border-color:var(--green);background:#eef3f0}.type-card b{display:block;margin-bottom:4px}.type-card.offer b{font-size:21px}.type-card.term b{font-size:15px}button{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#e9efec;color:var(--green)}.danger{background:#f8e7e5;color:var(--danger)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spacer{flex:1}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}nav button{background:transparent;color:var(--muted);min-width:90px}nav button.active{color:var(--green);background:#eef3f0}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{margin:0 0 4px;font-size:16px}.meta{font-size:13px;color:var(--muted);line-height:1.45}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#f7e9c9;color:#76540a}.badge.done{background:#dcefe4;color:#1c633f}.badge.term{background:#e4ebf8;color:#2c4e7a}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#17211d;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:20;display:none}.required{color:#a33b32}.location-ok{font-size:12px;color:#1c633f;margin-top:6px}.section-title{font-size:15px;margin:16px 0 4px}.hint{font-size:12px;color:var(--muted);margin:4px 0 8px}@media(min-width:650px){.checks{grid-template-columns:repeat(4,1fr)}}

.app-header{display:flex;align-items:center;gap:14px;padding:10px 0 18px}.logo-wrap{width:190px;min-height:58px;display:flex;align-items:center}.company-logo{width:190px;height:auto;max-height:72px;object-fit:contain;object-position:left center}.logo-fallback{display:none;align-items:center;justify-content:center;flex-direction:column;width:190px;min-height:58px;border:1px solid var(--line);border-radius:10px;color:#73a900;font-weight:800;line-height:1.05;text-align:center}.logo-fallback span{font-size:11px;font-weight:600;margin-top:4px}.app-header h1{margin:0}.app-header .sub{margin-top:4px}
</style>
</head>
<body>
<header class="app-header"><div class="logo-wrap"><img class="company-logo" src="https://baum-service-nord.de/wp-content/uploads/2021/09/baumservicenord_logoweb.png" alt="Baum Service Nord – Die Baumexperten" referrerpolicy="no-referrer" loading="eager" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="logo-fallback" aria-label="Baum Service Nord – Die Baumexperten">Baum Service Nord<span>Die Baumexperten</span></div></div><div><h1>KundenAngebot</h1><div class="sub">mobile Baustellenaufnahme</div></div></header>
<main id="app"></main>
<nav><button id="navHome" onclick="showView('home')">Übersicht</button><button id="navCustomers" onclick="showView('customers')">Kunden</button><button id="navNew" class="primary" onclick="showView('new')">＋ Neu</button></nav>
<div id="toast" class="toast"></div>
<script>
const KEY="kundenAngebot_v3";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentView="home",editId=null,draftLocation={lat:null,lon:null},newType="";
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function showView(v,id=null){currentView=v;editId=id;if(v==='new'&&id===null)newType='';render()}
function nav(){["navHome","navCustomers","navNew"].forEach(x=>document.getElementById(x)?.classList.remove("active"));document.getElementById({home:"navHome",customers:"navCustomers",new:"navNew",detail:"navCustomers"}[currentView])?.classList.add("active")}
function render(){nav();const app=document.getElementById("app");if(currentView==="home")app.innerHTML=home();else if(currentView==="customers")app.innerHTML=customers();else if(currentView==="new")app.innerHTML=form(editId?data.find(x=>x.id===editId):null);else app.innerHTML=detail(editId)}
function home(){const open=data.filter(x=>x.type==="angebot"&&!x.offerCreated).length,done=data.filter(x=>x.type==="angebot"&&x.offerCreated).length,term=data.filter(x=>x.type==="termin").length;return `<div class="grid"><div class="stat"><span>Offene Angebote</span><b>${open}</b></div><div class="stat"><span>Angebote erstellt</span><b>${done}</b></div></div><div class="card"><div class="row"><h2 style="margin:0">Übersicht</h2><span class="spacer"></span><span class="small">Termine: ${term}</span></div>${data.length?data.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,8).map(itemRow).join(""):`<p class="small">Noch keine Datensätze gespeichert.</p>`}</div><div class="card"><b>Datensicherung</b><p class="small">Die Daten liegen lokal auf diesem iPhone. Exportiere regelmäßig eine Sicherung.</p><div class="row"><button class="secondary" onclick="exportData()">Daten exportieren</button><button class="secondary" onclick="document.getElementById('importFile').click()">Daten importieren</button><input id="importFile" class="hidden" type="file" accept=".json" onchange="importData(this.files[0])"></div></div>`}
function customers(){return `<div class="card"><div class="row"><h2 style="margin:0">Kunden & Datensätze</h2><span class="spacer"></span><button class="primary" onclick="showView('new')">＋ Neu</button></div><label>Suche</label><input id="search" placeholder="Name, Telefon, E-Mail, Adresse…" oninput="filterList(this.value)"><div id="list">${data.slice().sort((a,b)=>b.createdAt-a.createdAt).map(itemRow).join("")||`<p class="small">Noch keine Einträge.</p>`}</div></div>`}
function filterList(q){q=q.toLowerCase();document.querySelectorAll("#list .item").forEach(e=>e.style.display=e.dataset.search.includes(q)?"":"none")}
function itemRow(x){const q=[x.customer,x.phone,x.email,x.address,x.task,x.consider,x.access,x.other,x.type].join(" ").toLowerCase();const label=x.type==="termin"?"Terminvereinbarung":(x.offerCreated?"Angebot erstellt":"Angebot offen");return `<div class="item" data-search="${esc(q)}" onclick="showView('detail','${x.id}')"><div class="row"><h3>${esc(x.customer||"Ohne Kundennamen")}</h3><span class="spacer"></span><span class="badge ${x.type==='termin'?'term':(x.offerCreated?'done':'')}">${label}</span></div><div class="meta">${esc(x.address||"Keine Adresse")} · ${x.date?new Date(x.date).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"kein Termin"}<br>${esc(x.task||"Keine Tätigkeitsbeschreibung")}</div></div>`}
function blank(){return {id:crypto.randomUUID(),type:"",customer:"",phone:"",email:"",address:"",date:"",task:"",consider:"",access:"",skt:false,hab:false,disposalAll:false,stammholz:false,astwerk:false,hackschnitzel:false,other:"",offerCreated:false,photos:[],lat:null,lon:null,createdAt:Date.now()}}
function form(x){x=x||blank();if(!x.type&&newType)x.type=newType;draftLocation={lat:x.lat,lon:x.lon};if(!x.type&&!editId)return `<div class="card"><div class="row"><h2 style="margin:0">Neuen Datensatz erstellen</h2><span class="spacer"></span><button class="secondary" onclick="showView('home')">Abbrechen</button></div><div class="section-title">Wofür werden die Daten benötigt? <span class="required">*</span></div><p class="hint">Bitte zuerst auswählen. Erst danach werden die Eingabefelder angezeigt.</p><div class="type-grid"><div class="type-card offer" onclick="chooseType('angebot')"><b>📋 Angebot</b><span class="small">Kundendaten und Leistungsumfang für ein Angebot erfassen</span></div><div class="type-card term" onclick="chooseType('termin')"><b>📅 Terminvereinbarung</b><span class="small">Termin und Kundendaten erfassen</span></div></div><p class="hint">Weitere Eingabemasken können später hier als zusätzliche Auswahl ergänzt werden.</p></div>`;return `<div class="card"><div class="row"><h2 style="margin:0">${editId?"Datensatz bearbeiten":"Neuen Datensatz erstellen"}</h2><span class="spacer"></span><button class="secondary" onclick="showView(editId?'detail':'home',editId)">Abbrechen</button></div><div class="section-title">1. Wofür werden die Daten benötigt? <span class="required">*</span></div><div class="type-grid"><div class="type-card ${x.type==='termin'?'selected':''}" onclick="chooseType('termin')"><b>📅 Terminvereinbarung</b><span class="small">Kundentermin erfassen</span></div><div class="type-card ${x.type==='angebot'?'selected':''}" onclick="chooseType('angebot')"><b>📋 Angebot</b><span class="small">Daten für ein Angebot erfassen</span></div></div><input id="f_type" type="hidden" value="${esc(x.type)}"><div class="section-title">2. Kundendaten</div><label>Kundenname <span class="required">*</span></label><input id="f_customer" value="${esc(x.customer)}" autocomplete="name"><label>Adresse</label><input id="f_address" value="${esc(x.address)}" autocomplete="street-address"><div class="row" style="margin-top:8px"><button class="secondary" onclick="getLocation()">📍 Standort übernehmen</button><button class="secondary" onclick="openMaps()">🗺️ Adresse in Karten</button></div><div id="locationStatus" class="location-ok">${draftLocation.lat?"✓ Standort übernommen":""}</div><label>Telefonnummer</label><input id="f_phone" value="${esc(x.phone)}" type="tel" autocomplete="tel"><label>E-Mail-Adresse</label><input id="f_email" value="${esc(x.email)}" type="email" autocomplete="email"><div id="appointmentBlock" class="${x.type==='termin'?'':'hidden'}"><label>Termin</label><input id="f_date" value="${esc(x.date)}" type="datetime-local"><div class="hint">Bei einer Terminvereinbarung bitte den gewünschten Termin eintragen.</div></div><div class="section-title">3. Einsatz</div><label>Was ist zu tun? <span class="required">*</span></label><textarea id="f_task" placeholder="Beschreibung der Arbeiten">${esc(x.task)}</textarea><label>Was ist zu bedenken?</label><textarea id="f_consider" placeholder="Besonderheiten, Gefahren, Wünsche, Hinweise…">${esc(x.consider)}</textarea><label>Zugang</label><textarea id="f_access" placeholder="Zugang zum Grundstück / Baum, Zufahrt, Engstellen, Schlüssel usw.">${esc(x.access)}</textarea><label>Zugang / Arbeitsmittel</label><div class="checks"><label class="check"><input id="f_skt" type="checkbox" ${x.skt?'checked':''}> SKT</label><label class="check"><input id="f_hab" type="checkbox" ${x.hab?'checked':''}> HAB</label></div><label>Entsorgung</label><div class="hint">„Alles“ setzt Stammholz, Astwerk und Hackschnitzel gemeinsam.</div><div class="checks"><label class="check"><input id="f_all" type="checkbox" ${x.disposalAll?'checked':''} onchange="toggleAllDisposal(this.checked)"> Alles</label><label class="check"><input id="f_stamm" type="checkbox" ${x.stammholz?'checked':''} onchange="individualDisposalChanged()"> Stammholz</label><label class="check"><input id="f_ast" type="checkbox" ${x.astwerk?'checked':''} onchange="individualDisposalChanged()"> Astwerk</label><label class="check"><input id="f_hack" type="checkbox" ${x.hackschnitzel?'checked':''} onchange="individualDisposalChanged()"> Hackschnitzel</label></div><label>Sonstiges</label><textarea id="f_other" placeholder="Weitere Angaben">${esc(x.other)}</textarea><label>Foto machen</label><input id="f_photos" type="file" accept="image/*" capture="environment" multiple><div id="photoPreview" class="photo-grid">${(x.photos||[]).map(p=>`<img src="${p}">`).join("")}</div>${x.photos?.length?`<div class="small">${x.photos.length} Foto(s) bereits gespeichert.</div>`:""}<input id="f_offer" type="hidden" value="false"><hr><button class="primary" style="width:100%" onclick='saveForm(${JSON.stringify(x).replace(/</g,"\\u003c")})'>💾 Daten speichern</button>${editId?`<button class="danger" style="width:100%;margin-top:8px" onclick="deleteItem('${x.id}')">Datensatz löschen</button>`:""}<p class="small">Die Daten werden lokal auf diesem iPhone gespeichert.</p></div>`}
function chooseType(t){if(editId){setType(t);return}newType=t;render()}
function setType(t){const el=document.getElementById('f_type');if(el)el.value=t;document.querySelectorAll('.type-card').forEach(e=>e.classList.remove('selected'));document.querySelectorAll('.type-card')[t==='termin'?0:1].classList.add('selected');document.getElementById('appointmentBlock')?.classList.toggle('hidden',t!=='termin');const offer=document.getElementById('f_offer');if(t==='angebot'&&offer?.type==='checkbox'){}else if(offer)offer.value='false'}
function collect(x){x.type=document.getElementById('f_type').value;x.customer=document.getElementById('f_customer').value.trim();x.address=document.getElementById('f_address').value.trim();x.phone=document.getElementById('f_phone').value.trim();x.email=document.getElementById('f_email').value.trim();x.date=document.getElementById('f_date')?.value||"";x.task=document.getElementById('f_task').value.trim();x.consider=document.getElementById('f_consider').value.trim();x.access=document.getElementById('f_access').value.trim();x.skt=document.getElementById('f_skt').checked;x.hab=document.getElementById('f_hab').checked;x.disposalAll=document.getElementById('f_all').checked;x.stammholz=document.getElementById('f_stamm').checked;x.astwerk=document.getElementById('f_ast').checked;x.hackschnitzel=document.getElementById('f_hack').checked;x.other=document.getElementById('f_other').value.trim();x.offerCreated=x.offerCreated||false;x.lat=draftLocation.lat;x.lon=draftLocation.lon;return x}
async function saveForm(x){x=collect(x);if(!x.type){alert('Bitte zuerst Terminvereinbarung oder Angebot auswählen.');return}if(!x.customer||!x.task){alert('Bitte mindestens Kundenname und „Was ist zu tun?“ ausfüllen.');return}const files=[...document.getElementById('f_photos').files];if(files.length){x.photos=x.photos||[];for(const f of files)x.photos.push(await resizeImage(f))}const i=data.findIndex(y=>y.id===x.id);if(i>=0)data[i]=x;else data.push(x);save();toast('Daten gespeichert');showView('detail',x.id)}
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=1200,s=Math.min(1,max/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function detail(id){const x=data.find(y=>y.id===id);if(!x){showView('home');return ''}const type=x.type==='termin'?'Terminvereinbarung':'Angebot';const dispos=x.disposalAll?'Alles':[x.stammholz&&'Stammholz',x.astwerk&&'Astwerk',x.hackschnitzel&&'Hackschnitzel'].filter(Boolean).join(', ')||'Keine Auswahl';return `<div class="card"><div class="row"><h2 style="margin:0">${esc(x.customer)}</h2><span class="spacer"></span><span class="badge ${x.type==='termin'?'term':(x.offerCreated?'done':'')}">${x.type==='termin'?'Terminvereinbarung':(x.offerCreated?'Angebot erstellt':'Angebot offen')}</span></div><div class="meta">${esc(x.phone)} · <a href="tel:${esc(x.phone)}">Anrufen</a><br>${esc(x.email)}<br>${esc(x.address)}</div>${x.date?`<p><b>Termin:</b> ${new Date(x.date).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})}</p>`:''}<hr><b>Was ist zu tun?</b><p>${esc(x.task)}</p>${x.consider?`<b>Was ist zu bedenken?</b><p>${esc(x.consider)}</p>`:''}${x.access?`<b>Zugang</b><p>${esc(x.access)}</p>`:''}<b>SKT / HAB</b><p>${[x.skt&&'SKT',x.hab&&'HAB'].filter(Boolean).join(' · ')||'Keine Auswahl'}</p><b>Entsorgung</b><p>${esc(dispos)}</p>${x.other?`<b>Sonstiges</b><p>${esc(x.other)}</p>`:''}${x.photos?.length?`<b>Fotos</b><div class="photo-grid">${x.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}${x.lat?`<p class="small">📍 Standort gespeichert: ${x.lat.toFixed(5)}, ${x.lon.toFixed(5)}</p>`:''}<hr><div class="row"><button class="primary" onclick="showView('new','${x.id}')">Bearbeiten</button><button class="secondary" onclick='openMaps(${JSON.stringify(x.address)})'>🗺️ Karten</button>${x.type==='angebot'?`<button class="secondary" onclick="toggleOffer('${x.id}')">${x.offerCreated?'Als offen markieren':'Angebot erstellt'}</button>`:''}</div></div>`}
function toggleAllDisposal(on){['f_stamm','f_ast','f_hack'].forEach(id=>{const e=document.getElementById(id);if(e)e.checked=on})}
function individualDisposalChanged(){const vals=['f_stamm','f_ast','f_hack'].map(id=>document.getElementById(id)?.checked);const all=document.getElementById('f_all');if(all)all.checked=vals.every(Boolean)}
function toggleOffer(id){const x=data.find(y=>y.id===id);x.offerCreated=!x.offerCreated;save();render()}
function deleteItem(id){if(confirm('Diesen Datensatz wirklich löschen?')){data=data.filter(x=>x.id!==id);save();showView('customers')}}
function getLocation(){if(!navigator.geolocation){alert('Standort ist auf diesem Gerät nicht verfügbar.');return}navigator.geolocation.getCurrentPosition(p=>{draftLocation={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('locationStatus').textContent='✓ Standort übernommen';toast('Standort übernommen');},e=>alert('Standort konnte nicht ermittelt werden. Bitte Standortfreigabe für diese Web-App erlauben.'),{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function openMaps(address=''){if(!address)address=document.getElementById('f_address')?.value||'';if(!address){alert('Bitte zuerst eine Adresse eingeben.');return}location.href='https://maps.apple.com/?address='+encodeURIComponent(address)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KundenAngebot-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('Import ersetzt die aktuell gespeicherten Daten. Fortfahren?')){data=d;save();render();toast('Import abgeschlossen')}}catch(e){alert('Die Datei ist keine gültige Sicherung.')}};r.readAsText(file)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script>
</body>
</html>
